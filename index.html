<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Edit Squad</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { margin:0; font-family: Arial,sans-serif; color:#fff; background:#121212; }
    nav { position:sticky; top:0; background:#1c1c1c; padding:10px; text-align:center; }
    nav a { margin:0 15px; color:#eee; text-decoration:none; }
    .hero { background:url('images/hero.jpg') center/cover; height:70vh; display:flex;
            flex-direction:column; justify-content:center; align-items:center; text-align:center; }
    .hero img { width: 200px; border-radius: 20px; margin-bottom: 20px; }
    .hero h1 { font-size:3rem; color:#e91e63; }
    .hero button { margin-top:20px; padding:10px 30px; font-size:1rem;
                   background:#e91e63; border:none; color:#fff; cursor:pointer; }
    section { padding:60px 20px; text-align:center; }
    .services {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 20px;
    }
    .service-box, .stat-box {
      background:#1c1c1c;
      border-radius:10px;
      padding:20px;
      width:200px;
      text-align: center;
    }
    .gallery { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
               gap:15px; }
    .gallery img, .bts img { width:100%; border-radius:10px; }
    .contact form { display:flex; flex-direction:column; max-width:400px; margin:0 auto; }
    .contact input, .contact textarea { margin:10px 0; padding:10px; border-radius:5px;
                                         border:none; }
    .contact button { padding:10px; background:#e91e63; color:#fff; border:none; cursor:pointer; }
    .social-icons {
      margin-top: 20px;
    }
    .social-icons a {
      margin: 0 10px;
      color: #e91e63;
      font-size: 24px;
      text-decoration: none;
      transition: color 0.3s;
    }
    .social-icons a:hover {
      color: #ffffff;
    }
    footer { background:#1c1c1c; padding:20px; font-size:0.9rem; }
  </style>
</head>
<body>
<!-- full body structure continues here -->
</body>
</html>
